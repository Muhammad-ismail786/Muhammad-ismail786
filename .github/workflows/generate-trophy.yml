
name: Update GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=Muhammad-ismail786&theme=tokyonight&no-frame=true&row=1&column=4'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save trophy to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git commit -m "Update GitHub trophies" || exit 0
          git push
